version: '3.8'

services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - app-network

  # Production setup (uncomment to use)
  # frontend-prod:
  #   build:
  #     context: .
  #     target: production
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network

networks:
  app-network:
    external: true
